version: '3.8'

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: freight_backend
    restart: always
    env_file:
      - ../backend/.env
    ports:
      - "3000:3000"
    #volumes:
      #- ../backend:/usr/src/app
      #- /usr/src/app/node_modules
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: freight_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: freight_platform
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  pgadmin:
    image: dpage/pgadmin4
    container_name: freight_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: freight_frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  postgres_data: