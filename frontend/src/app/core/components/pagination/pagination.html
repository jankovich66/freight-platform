<div class="d-flex justify-content-center mt-4">
    <nav>
        <ul class="pagination mb-0">
            @for(number of numbers; track number) {
                <li class="page-item" [class.active]="page === number + 1">
                    <button class="page-link" (click)="change(number + 1)">{{ number + 1 }}</button>
                </li>
            }
        </ul>
    </nav>
</div>
