<div class="container mt-4">
    <h2 class="mb-4">My assignments</h2>
    @if(assignments$ | async; as assignments) {
        @if(assignments.length === 0) {
            <div class="text-center p-4 text-muted">
                You have no assigned loads
            </div>
        }
        @else {
            <div class="row g-4">
            @for(assignment of assignments; track assignment.id) {
                <div class="col-md-6 col-lg-4">
                    <app-assignment-card [assignment]="assignment" (start)="startTransport($event)" (complete)="completeTransport($event)" (cancel)="cancelTransport($event)"></app-assignment-card>
                </div>
            }
            </div>
        }
    }
</div>
