<div class="card shadow-sm h-100">
    <div class="card-body d-flex flex-column">
        <h5 class="card-title mb-3">{{ carrier.companyName }}</h5>
        @if(type === 'assignment') {
            <a [routerLink]="['/admin/assignments', carrier.id]" class="btn btn-outline-primary mt-3 w-100">View assignments</a>
        }
        @else if(type === 'application') {
            <a [routerLink]="['/admin/applications', carrier.id]" class="btn btn-outline-primary mt-3 w-100">View applications</a>
        }
    </div>
</div>
