<mat-card class="admin-carrier-material-card h-100 d-flex flex-column mat-elevation-z2">
    <mat-card-header class="p-3 pb-2 w-100">
        <div class="d-flex align-items-center gap-2">
            <mat-icon color="primary">local_shipping</mat-icon>
            <mat-card-title class="fs-5 font-weight-medium text-dark m-0">
                {{ carrier.companyName || 'Unknown carrier' }}
            </mat-card-title>
        </div>
    </mat-card-header>
    <mat-card-content class="flex-grow-1 px-3 pb-2">
        <p class="text-muted small m-0">Carrier overview for logistics, load assignments, and open applications tracking.</p>
    </mat-card-content>

    <mat-card-actions class="p-3 pt-0 mt-auto w-100 border-top-light">
        @if(type === 'assignment') {
            <a mat-stroked-button class="admin-action-btn w-100" [routerLink]="['/admin/assignments', carrier.id]">
                <mat-icon>assignment</mat-icon> View assignments
            </a>
        }
        @else if(type === 'application') {
            <a mat-stroked-button class="admin-action-btn w-100" [routerLink]="['/admin/applications', carrier.id]">
                <mat-icon>description</mat-icon> View applications
            </a>
        }
    </mat-card-actions>
</mat-card>
