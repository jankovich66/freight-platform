@if (carriersWithApplications$ | async; as carriers) {
    <div class="container">
        <h2 class="mb-4">Carriers with Applications</h2>
        <div class="row">
            @if(carriers.length !== 0) {
                @for(carrier of carriers; track carrier.id) {
                    <div class="col-md-4 mb-4">
                        <app-admin-carrier-card [carrier]="carrier" [type]="'application'"></app-admin-carrier-card>
                    </div>
                }
            }
            @else {
                <p>No carriers with applications found.</p>
            }
        </div>
    </div>
}
