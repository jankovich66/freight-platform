<div class="container">
    <h2 class="mb-4">Carriers with Applications</h2>
    <div class="row">
        @if(carriersWithApplications.length !== 0) {
            @for(carrier of carriersWithApplications; track carrier.id) {
                <div class="col-md-4 mb-4">
                    <app-admin-carrier-card [carrier]="carrier" [type]="'application'"></app-admin-carrier-card>
                </div>
            }
        }
        @else {
            <p>No carriers with applications found.</p>
        }
    </div>
    @if(total > limit) {
        <app-pagination [page]="page" [lastPage]="lastPage" (pageChange)="goToPage($event)"></app-pagination>
    }
</div>
