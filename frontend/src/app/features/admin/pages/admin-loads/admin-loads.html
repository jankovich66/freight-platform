@if(user$ | async; as user) {
    <div class="container">
        <!-- <h2 class="mb-4">Loads</h2>

            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Search title" [(ngModel)]="filters.title">
            </div>
            <div class="col-md-2">

        <div class="row mb-4 align-items-center">
        <div class="col-md-6">
            <input type="text" class="form-control" placeholder="Search" [(ngModel)]="filters.search" (keyup.enter)="applyFilters()">
        </div>
        <div class="col-md-6">
            <div class="d-flex gap-2 justify-content-md-end mt-3 mt-md-0">
                <select class="form-select w-auto" [(ngModel)]="sort" (change)="fetchLoads()">
                    <option value="pickupDate">Pickup date</option>
                    <option value="price">Price</option>
                    <option value="weight">Weight</option>
                </select>
                <button class="btn btn-outline-secondary w-100" (click)="toggleOrder()">
                    {{ order === 'ASC' ? 'ASC' : 'DESC' }}
                </button>

                <select class="form-select w-auto" [(ngModel)]="limit" (change)="fetchLoads()">
                    <option [ngValue]="6">6</option>
                    <option [ngValue]="12">12</option>
                    <option [ngValue]="18">18</option>
                </select>
            </div>
        </div>
    </div>
        <div class="row">
            @if(isLoading) {
                <div class="text-center my-5">
                    <div class="spinner-border"></div>
                </div>
            }
            @else {
                @if(loads.length !== 0) {
                    @for(load of loads; track load.id) {
                        <div class="col-md-4 mb-4">
                            <app-load-card [load]="load" [userRole]="user.role"></app-load-card>
                        </div>
                    }
                }
                @else {
                    <div class="col-12">
                        <p class="text-center">No loads found.</p>
                    </div>
                }
            }
        </div>
        @if(total > limit) {
            <app-pagination [page]="page" [lastPage]="lastPage" (pageChange)="goToPage($event)"></app-pagination>
        }
    </div>
}
