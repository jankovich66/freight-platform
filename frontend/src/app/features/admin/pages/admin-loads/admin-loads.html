@if(user$ | async; as user) {
    <div class="container">
        <h2 class="mb-4">Loads</h2>
        <div class="row mb-4">
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Search title" [(ngModel)]="filters.title">
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" (click)="fetchLoads()">Search</button>
            </div>
        </div>
        <div class="row">
            @if(isLoading) {
                <div class="text-center my-5">
                    <div class="spinner-border"></div>
                </div>
            }
            @else {
                @if(loads.length !== 0) {
                    @for(load of loads; track load.id) {
                        <div class="col-md-4 mb-4">
                            <app-load-card [load]="load" [userRole]="user.role"></app-load-card>
                        </div>
                    }
                }
                @else {
                    <div class="col-12">
                        <p class="text-center">No loads found.</p>
                    </div>
                }
            }
        </div>
        @if(total > limit) {
            <app-pagination [page]="page" [lastPage]="lastPage" (pageChange)="goToPage($event)"></app-pagination>
        }
    </div>
}
