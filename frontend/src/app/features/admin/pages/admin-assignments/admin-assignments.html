<div class="container">
    <h2 class="mb-4">Carriers with Assignments</h2>
    <div class="row">
        @if(carriersWithAssignments.length !== 0) {
            @for(carrier of carriersWithAssignments; track carrier.id) {
                <div class="col-md-4 mb-4">
                    <app-admin-carrier-card [carrier]="carrier" [type]="'assignment'"></app-admin-carrier-card>
                </div>
            }
        }
        @else {
            <p>No carriers with assignments found.</p>
        }
    </div>
    @if(total > limit) {
        <app-pagination [page]="page" [lastPage]="lastPage" (pageChange)="goToPage($event)"></app-pagination>
    }
</div>
