<div class="container mt-4">
    <h2 class="mb-4">Users</h2>
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Email</th>
                        <th>Phone number</th>
                        <th>Role</th>
                        <th>Company name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                @if(users$ | async; as users) {
                    <tbody>
                        @for(user of users; track user.email) {
                            <tr>
                                <td>{{ user.email }}</td>
                                <td>{{ user.phoneNumber }}</td>
                                <td>{{ user.role }}</td>
                                <td>{{ user.companyName }}</td>
                                <td><button class="btn btn-danger btn-sm" (click)="openDeleteModal(deleteModal, user.email, $event)">Delete user</button></td>
                            </tr>
                        }
                    </tbody>
                }
            </table>
        </div>
    </div>
</div>

<ng-template #deleteModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Delete user</h5>
        <button class="btn-close" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body">
        Are u sure u want to delete this user?
        <br>
        <strong>This action cannot be undone</strong>
    </div>
    <div class="modal-footer">
        <button class="btn btn-secondary" (click)="modal.dismiss()">Cancel</button>
        <button class="btn btn-danger" (click)="confirmDelete(modal)">Delete</button>
    </div>
</ng-template>
