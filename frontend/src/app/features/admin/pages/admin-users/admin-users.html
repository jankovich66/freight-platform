
<div class="container mt-4 mb-5">
    <h2 class="mb-4 font-weight-medium text-dark d-flex align-items-center">
        <mat-icon color="primary" class="me-2 fs-3" style="width:auto;height:auto;">people</mat-icon>
        Platform Users Management
    </h2>
    
    @if(users$ | async; as users) {
        <div class="row g-4">
            @for(user of users; track user.email) {
                <div class="col-12 col-sm-6 col-lg-4">
                    <app-user-card [user]="user" (delete)="openDeleteDialog(deleteDialog, $event)"></app-user-card>
                </div>
            }
        </div>
    }
</div>

<ng-template #deleteDialog let-dialogRef>
    <h2 mat-dialog-title class="text-danger d-flex align-items-center">
        <mat-icon class="me-2">warning</mat-icon> Delete user
    </h2>
    
    <mat-dialog-content>
        <p class="fs-6">Are you sure you want to delete this user from the platform?</p>
        <strong class="text-danger">This action cannot be undone and will erase all user access.</strong>
    </mat-dialog-content>
    
    <mat-dialog-actions align="end" class="pb-3 pe-3 gap-2">
        <button mat-stroked-button mat-dialog-close>Cancel</button>
        <button mat-flat-button color="warn" style="border-radius: 6px;" (click)="confirmDelete(dialogRef)">
            <mat-icon>delete_forever</mat-icon> Delete
        </button>
    </mat-dialog-actions>
</ng-template>
