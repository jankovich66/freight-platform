<div>
    <h2>Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" class="form-control" formControlName="email">
            @if(loginForm.controls['email'].touched && loginForm.controls['email'].invalid) {
                <div class="error-message">Email is required.</div>
            }
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" name="password" id="password" class="form-control" formControlName="password">
            @if(loginForm.controls['password'].touched && loginForm.controls['password'].invalid) {
                <div class="error-message">Password is required.</div>
            }
        </div>
        <button type="submit" class="btn-submit" [disabled]="!loginForm.valid">Login</button>
    </form>
</div>

<button (click)="idiNaLoads()">Loads</button>
