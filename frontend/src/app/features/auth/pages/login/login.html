<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <mat-card class="auth-material-card mat-elevation-z3">
                <mat-card-content class="p-4">
                    <h3 class="text-center mb-4 font-weight-medium text-dark">Login</h3>
                    
                    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                        <div class="mb-3">
                            <mat-form-field appearance="outline" class="w-100">
                                <mat-label>Email address</mat-label>
                                <input matInput type="email" placeholder="name@example.com" formControlName="email">
                                <mat-icon matPrefix class="text-muted me-1">email</mat-icon>
                                <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
                            </mat-form-field>
                        </div>

                        <div class="mb-4">
                            <mat-form-field appearance="outline" class="w-100">
                                <mat-label>Password</mat-label>
                                <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
                                <mat-icon matPrefix class="text-muted me-1">lock</mat-icon>
                                <button type="button" mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword">
                                    <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                                </button>
                                <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
                            </mat-form-field>
                        </div>

                        <button mat-flat-button color="primary" class="w-100 py-3 btn-auth" [disabled]="loginForm.invalid">Login</button>
                    </form>
                </mat-card-content>
            </mat-card>
        </div>
  </div>
</div>
