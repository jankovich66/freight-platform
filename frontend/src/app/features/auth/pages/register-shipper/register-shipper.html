<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <mat-card class="auth-material-card mat-elevation-z3">
                <mat-card-content class="p-4">
                    <h3 class="text-center mb-4 font-weight-medium text-dark">Register Shipper</h3>
                    
                    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                        <div class="mb-3">
                            <mat-form-field appearance="outline" class="w-100">
                                <mat-label>Email address</mat-label>
                                <input matInput type="email" placeholder="name@example.com" formControlName="email">
                                <mat-icon matPrefix class="text-muted me-1">email</mat-icon>
                                <mat-error *ngIf="registerForm.get('email')?.hasError('required')">Email is required</mat-error>
                            </mat-form-field>
                        </div>
                        <div class="mb-3">
                            <mat-form-field appearance="outline" class="w-100">
                                <mat-label>Password</mat-label>
                                <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
                                <mat-icon matPrefix class="text-muted me-1">lock</mat-icon>
                                <button type="button" mat-icon-button matSuffix (click)="hidePassword = !hidePassword">
                                <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                                </button>
                                <mat-error *ngIf="registerForm.get('password')?.hasError('required')">Password is required</mat-error>
                            </mat-form-field>
                        </div>
                        <div class="mb-3">
                            <mat-form-field appearance="outline" class="w-100">
                                <mat-label>Phone number</mat-label>
                                <input matInput type="text" placeholder="060123456" formControlName="phoneNumber">
                                <mat-icon matPrefix class="text-muted me-1">phone</mat-icon>
                                <mat-error *ngIf="registerForm.get('phoneNumber')?.hasError('required')">Phone number is required</mat-error>
                            </mat-form-field>
                        </div>
                        <div class="mb-4">
                            <mat-form-field appearance="outline" class="w-100">
                                <mat-label>Company name</mat-label>
                                <input matInput type="text" placeholder="Transport Company" formControlName="companyName">
                                <mat-icon matPrefix class="text-muted me-1">corporate_fare</mat-icon>
                                <mat-error *ngIf="registerForm.get('companyName')?.hasError('required')">Company name is required</mat-error>
                            </mat-form-field>
                        </div>
                        <button mat-flat-button color="primary" class="w-100 py-3 btn-auth" [disabled]="registerForm.invalid">Register</button>
                    </form>
                </mat-card-content>
            </mat-card>
        </div>
    </div>
</div>
