<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm p-3">
                <h3 class="text-center mb-4">Register Carrier</h3>
                <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" formControlName="email">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" name="password" id="password" class="form-control" formControlName="password">
                    </div>
                    <div class="mb-3">
                        <label for="phone-number" class="form-label">Phone number</label>
                        <input type="text" name="phone-number" id="phone-number" class="form-control" placeholder="060123456" formControlName="phoneNumber">
                    </div>
                    <div class="mb-3">
                        <label for="company-name" class="form-label">Company name</label>
                        <input type="text" name="company-name" id="company-name" class="form-control" formControlName="companyName">
                    </div>
                    <button class="btn btn-primary w-100" [disabled]="registerForm.invalid">Register</button>
                </form>
            </div>
        </div>
    </div>
</div>
