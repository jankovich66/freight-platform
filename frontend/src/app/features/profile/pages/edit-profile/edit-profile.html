<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="mb-4">Edit profile</h3>
            <form [formGroup]="editForm" (ngSubmit)="onSave()">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" name="email" id="email" class="form-control" formControlName="email">
                </div>
                <div class="mb-3">
                    <label for="phone-number" class="form-label">Phone number</label>
                    <input type="text" name="phone-number" id="phone-number" class="form-control" formControlName="phoneNumber">
                </div>
                <div class="mb-3">
                    <label for="company-name" class="form-label">Company name</label>
                    <input type="text" name="company-name" id="company-name" class="form-control" formControlName="companyName">
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" [disabled]="editForm.invalid">Save</button>
                    <button class="btn btn-outline-secondary" (click)="onCancel()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>
