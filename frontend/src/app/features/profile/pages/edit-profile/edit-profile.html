<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <mat-card class="profile-material-card mat-elevation-z3">
                <mat-card-content class="p-4">
                    <h3 class="mb-4 font-weight-medium text-dark d-flex align-items-center">
                        <mat-icon color="primary" class="me-2 fs-4" style="width:auto;height:auto;">manage_accounts</mat-icon>
                        Edit Profile
                    </h3>
                    <form [formGroup]="editForm" (ngSubmit)="onSave()">
                        <div class="mb-3">
                            <mat-form-field appearance="outline" class="w-100">
                                <mat-label>Email Address</mat-label>
                                <input matInput type="email" formControlName="email">
                                <mat-icon matPrefix class="text-muted me-1">email</mat-icon>
                                <mat-error *ngIf="editForm.get('email')?.hasError('required')">Email is required</mat-error>
                            </mat-form-field>
                        </div>

                        <div class="mb-3">
                            <mat-form-field appearance="outline" class="w-100">
                                <mat-label>Phone Number</mat-label>
                                <input matInput type="text" formControlName="phoneNumber">
                                <mat-icon matPrefix class="text-muted me-1">phone</mat-icon>
                                <mat-error *ngIf="editForm.get('phoneNumber')?.hasError('required')">Phone number is required</mat-error>
                            </mat-form-field>
                        </div>

                        <div class="mb-4">
                            <mat-form-field appearance="outline" class="w-100">
                                <mat-label>Company Name</mat-label>
                                <input matInput type="text" formControlName="companyName">
                                <mat-icon matPrefix class="text-muted me-1">corporate_fare</mat-icon>
                                <mat-error *ngIf="editForm.get('companyName')?.hasError('required')">Company name is required</mat-error>
                            </mat-form-field>
                        </div>

                        <div class="d-flex gap-3 w-100">
                            <button mat-flat-button color="primary" class="flex-grow-1 btn-profile-save" [disabled]="editForm.invalid"><mat-icon>save</mat-icon> Save</button>
                            <button type="button" mat-stroked-button class="btn-profile-cancel" (click)="onCancel()">Cancel</button>
                        </div>
                    </form>
                </mat-card-content>
            </mat-card>
        </div>
    </div>
</div>
